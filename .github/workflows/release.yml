name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
          - os: macos-14
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow opencv-python-headless matplotlib
      - name: Linux Qt deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1 libgl1
      - name: Quick tests (no network)
        run: python -m pytest tests/test_core.py -q -k "audit_quick or costs_and_catalog or alerts_offline or vision_real or phase18 or phase19 or phase20" || true
      - name: Icons
        run: python packaging/make_icons.py
      - name: PyInstaller
        env: { QT_QPA_PLATFORM: offscreen }
        run: pyinstaller --noconfirm protrader.spec
      - name: Version
        shell: bash
        run: echo "PT_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
          Compress-Archive -Path dist\ProTrader\* -DestinationPath "release\ProTrader-$env:PT_VERSION-windows-x64-portable.zip"
      - name: Linux tarball + AppImage-style run script
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp packaging/protrader.desktop dist/ProTrader/ || true
          tar -C dist -czf "release/ProTrader-$PT_VERSION-linux-x64.tar.gz" ProTrader
      - name: Web & mobile bundle (same engine, no Qt — phone/VPS/Docker)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release webbundle/ProTrader-web
          rsync -a --exclude '.git' --exclude 'tests/shots' --exclude 'dist' --exclude 'build' --exclude '__pycache__' ./ webbundle/ProTrader-web/
          cd webbundle && zip -qr "../release/ProTrader-$PT_VERSION-web-mobile.zip" ProTrader-web && cd ..
          ls -la release
      - name: macOS dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          hdiutil create -volname "ProTrader" -srcfolder dist/ProTrader.app -ov -format UDZO "release/ProTrader-$PT_VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ProTrader-${{ matrix.artifact }}
          path: release/*
  android:
    # Mobile app = the SAME engine (core/, strategies/, web/, trained seeds) packaged with Chaquopy into an APK.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }          # must match chaquopy.defaultConfig.version
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Stage engine (self-test imports the engine with the Android-pinned stack)
        run: |
          python -m pip install -q -r requirements-web.txt opencv-python-headless matplotlib
          python scripts/prepare_android.py
      - name: Version
        shell: bash
        run: echo "PT_VERSION=$(grep -m1 -oE '## v[0-9]+\.[0-9]+\.[0-9]+' RELEASE_NOTES.md | cut -c4-)" >> $GITHUB_ENV
      - name: Signing key (secrets if present, else a generated key so the APK is still installable)
        shell: bash
        run: |
          if [ -n "${{ secrets.PT_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.PT_KEYSTORE_B64 }}" | base64 -d > android/release.jks
            echo "PT_KEYSTORE_PASS=${{ secrets.PT_KEYSTORE_PASS }}" >> $GITHUB_ENV; echo "PT_KEY_ALIAS=${{ secrets.PT_KEY_ALIAS }}" >> $GITHUB_ENV; echo "PT_KEY_PASS=${{ secrets.PT_KEY_PASS }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore android/release.jks -storepass protrader -keypass protrader -alias protrader -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ProTrader, O=ProTrader, C=GB"
            echo "PT_KEYSTORE_PASS=protrader" >> $GITHUB_ENV; echo "PT_KEY_ALIAS=protrader" >> $GITHUB_ENV; echo "PT_KEY_PASS=protrader" >> $GITHUB_ENV
          fi
          echo "PT_KEYSTORE=$GITHUB_WORKSPACE/android/release.jks" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/ProTrader-$PT_VERSION-android.apk"
          ls -la ../release
      - uses: actions/upload-artifact@v4
        with:
          name: ProTrader-android
          path: release/*
  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
